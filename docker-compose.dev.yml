services:

  backend:
    volumes:
      - ./backend/area_backend:/app

    ports:
      - "${BACK_PORT}:8000"

    environment:
      FLASK_DEBUG: "1"
      FLASK_ENV: development


  frontend:

    build:
      context: ./frontend
      target: development

    entrypoint: >
      sh -c "
      mkdir -p /app/src/assets &&
      echo \"window.env = { URL_FRONT: '$$URL_FRONT', URL_BACK: '$$URL_BACK' };\" > /app/src/assets/env.js &&
      exec npx ng serve camper
      --host 0.0.0.0
      --port 4200
      --allowed-hosts=all
      "

    volumes:
      - ./frontend/camper:/app
      - /app/node_modules

    ports:
      - "${FRONT_PORT}:4200"

    env_file:
      - .env

    stdin_open: true
    tty: true

    depends_on:
      backend:
        condition: service_healthy