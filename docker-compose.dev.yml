services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - .env

  backend:
    volumes:
      - ./backend/area_backend:/app

    ports:
      - "${BACK_PORT}:8000"

    environment:
      FLASK_DEBUG: "1"
      FLASK_ENV: development
      RATELIMIT_STORAGE_URI: "redis://redis:6379/0"

    depends_on:
      redis:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      target: development
    image: transcendence_team-frontend:dev

    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/src/assets
        echo "window.env = { URL_FRONT: '$$URL_FRONT', URL_BACK: '$$URL_BACK' };" > /app/src/assets/env.js
        exec npm start -- --host 0.0.0.0 --port 4200 --allowed-hosts=all

    volumes:
      - ./frontend/camper:/app
      - /app/node_modules

    ports:
      - "${FRONT_PORT:-4200}:4200"

    env_file:
      - .env

    stdin_open: true
    tty: true

    depends_on:
      backend:
        condition: service_healthy
