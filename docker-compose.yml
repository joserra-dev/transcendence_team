version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    # 1. Le añadimos un chequeo de salud a Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/area_backend
    # 1. CAMBIAMOS EL COMANDO: Añadimos el flag --debug
    command: python -m flask run --host=0.0.0.0 --port=5000 --debug
    volumes:
      # 2. VERIFICA ESTA RUTA: Asegúrate de que apunta a tu carpeta de código local
      - ./backend/area_backend:/app
    ports:
      - "${BACK_PORT}:5000"
    environment:
      - FLASK_APP=app.py
      - PYTHONPATH=.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # command: npm start # Descoméntalo si tu Dockerfile de Angular no tiene un CMD por defecto
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    environment:
    - URL_FRONT=${URL_FRONT}
    - URL_BACK=${URL_BACK}
    ports:
      - "${FRONT_PORT}:80" # Mapea el puerto 4200 de tu PC al puerto 80 del contenedor (Nginx/Angular)
    stdin_open: true 
    tty: true

volumes:
  postgres_data: # Corregido: Quitamos el texto plano que causaba error de sintaxis