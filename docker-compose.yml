services:

  db:
    build:
      context: ./ddbb
      dockerfile: Dockerfile
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend/area_backend

    environment:
      FLASK_APP: app.py
      PYTHONPATH: .

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local_dev_secret_change_me}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-local_public_api_key_change_me}
      PUBLIC_API_RATE_LIMIT: ${PUBLIC_API_RATE_LIMIT:-60}

      STRIPE_KEY: ${STRIPE_KEY}

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/status || curl -fsk https://localhost:8000/api/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 7
      start_period: 5s


volumes:
  postgres_data: