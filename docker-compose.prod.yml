services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:

    ports:
      - "${BACK_PORT}:8000"

    environment:
      FLASK_DEBUG: "0"
      FLASK_ENV: production
      RATELIMIT_STORAGE_URI: "redis://redis:6379/0"

    depends_on:
      redis:
        condition: service_healthy


  frontend:   
    build:
      context: ./frontend
      target: production

    depends_on:
          backend:
            condition: service_healthy

    #volumes:
      # Certificados TLS REALES firmados por una CA (no autofirmados).
      # Crea ./frontend/ssl/ con nginx-selfsigned.crt y nginx-selfsigned.key
      # (o ajusta los nombres en nginx.conf) y descomenta la línea:
      # - ./frontend/ssl:/etc/nginx/ssl:ro

    ports:
      - "${FRONT_PORT}:443"

    environment:
      URL_BACK: /

    entrypoint:
      - /docker-entrypoint.sh

    command: []
