services:
  backend:
    volumes: []
    ports: []
    command: gunicorn app:app --bind 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      target: production
    volumes: []
    ports:
      - "${FRONT_PORT}:443"
    environment:
      - URL_BACK=/
    command: []

# NOTE: For production deployment ensure URL_FRONT in .env uses https://