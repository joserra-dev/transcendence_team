services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:

    ports:
      - "${BACK_PORT}:8000"

    environment:
      FLASK_DEBUG: "0"
      FLASK_ENV: production
      RATELIMIT_STORAGE_URI: "redis://redis:6379/0"

    depends_on:
      redis:
        condition: service_healthy


  frontend:   
    build:
      context: ./frontend
      target: production

    depends_on:
          backend:
            condition: service_healthy

    # Certificados TLS montados desde ./frontend/ssl (generados por
    # frontend/ssl/generate-local.sh durante `make env`). Para producción real
    # con una CA, reemplaza esos archivos por los de tu CA.
    volumes:
      - ./frontend/ssl:/etc/nginx/ssl:ro

    ports:
      - "${FRONT_PORT}:443"

    environment:
      URL_BACK: /

    entrypoint:
      - /docker-entrypoint.sh

    command: []
